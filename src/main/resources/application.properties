spring.application.name=seat-reservation

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:reservation}
spring.datasource.password=${DB_PASSWORD:reservation}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
#spring.flyway.user=${DB_USERNAME:reservation}
#spring.flyway.password=${DB_PASSWORD:reservation}
#logging.level.org.flywaydb=DEBUG



management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.shutdown=graceful

logging.structured.format.console=logstash

security.admin-token=${ADMIN_TOKEN:admin-secret}