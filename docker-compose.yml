services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seat_reservation
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
